name: Build StarfallTab
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile and package
        run: mvn --batch-mode --no-transfer-progress clean package
      - if: ${{ vars.UPLOAD_BUILD_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: StarfallTab-jar
          path: target/StarfallTab-1.0.0.jar

      - name: Package standalone Starfall resource pack
        shell: bash
        run: |
          cd resourcepack
          zip -q -r ../StarfallTab-ResourcePack.zip pack.mcmeta assets
      - if: ${{ vars.UPLOAD_BUILD_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: StarfallTab-ResourcePack
          path: StarfallTab-ResourcePack.zip
